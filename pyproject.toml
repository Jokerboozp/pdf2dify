[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2dify"
version = "0.1.0"
description = "Visual PDF processing and Dify ingestion console"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
pdf2dify-api = "pdf2dify.main:run"
pdf2dify-worker = "pdf2dify.worker:run"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
