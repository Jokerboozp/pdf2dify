[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-pdf-rag"
version = "0.1.0"
description = "Local and traceable PDF processing for Dify operations knowledge"
requires-python = ">=3.11"
dependencies = [
  "pypdfium2>=4.30,<5", "pdfplumber>=0.11,<0.12", "Pillow>=10,<12",
  "httpx>=0.27,<0.29", "PyYAML>=6,<7", "rapidocr-onnxruntime==1.4.4", "python-docx==1.2.0",
  "fastembed==0.8.0", "fastapi==0.135.2", "uvicorn==0.42.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
layout = ["paddleocr[doc-parser]==3.3.2", "paddlepaddle==3.2.2"]

[project.scripts]
ops-rag = "ops_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
