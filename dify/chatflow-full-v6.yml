    - id: retrieve_internal
      type: custom
      position:
        x: 1000
        y: 880
      positionAbsolute:
        x: 1000
        y: 880
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: knowledge-retrieval
        title: 内部交易
        desc: ''
        selected: false
        dataset_ids:
        - cc66e7b0-8f6f-4574-852d-b25626f3eb90
        query_variable_selector:
        - normalize
        - structured_output
        - search_query
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 6
          score_threshold: null
          reranking_mode: weighted_score
          reranking_enable: false
          weights:
            weight_type: customized
            vector_setting:
              vector_weight: 0.7
