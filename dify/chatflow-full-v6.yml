version: 0.7.0
kind: app
app:
  name: ERP运维知识助手-全量演示
  description: 9个业务主题库，按问题路由，原文图文溯源。本地解析和OCR，资料业务适用性待复核。
  mode: advanced-chat
  icon: 📚
  icon_type: emoji
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 你好，我可以帮助查找财务、资金、采购、项目、设备、内部交易、油气业务和主数据资料。请描述业务对象、操作或报错；回答会附原文页码和相关截图。资料适用性待业务复核。
    suggested_questions:
    - 项目结转后怎么撤销？
    - 物料不在工厂下，如何批量扩充？
    - 创建付款单时收款人账号信息无法修改怎么办？
    suggested_questions_after_answer:
      enabled: false
    retriever_resource:
      enabled: true
    file_upload:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 500
      positionAbsolute:
        x: 0
        y: 500
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 用户提问
        desc: ''
        selected: false
        variables: []
    - id: normalize
      type: custom
      position:
        x: 300
        y: 500
      positionAbsolute:
        x: 300
        y: 500
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 理解问题并选择业务范围
        desc: ''
        selected: false
        model: &id001
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - id: route-system
          role: system
          text: '你是 ERP 运维问题整理与业务分类器。只整理问题和选择检索范围，不回答业务操作。

            结合最近对话补全指代；用户切换话题时以本轮明确对象为准。保留事务码、报错、否定条件、项目类型和用户指定版本，不编造缺失信息。


            route 只能选择以下值：

            finance：会计凭证、财务核算、发票、清账、财务月结。

            funds：资金、收付款、司库、资金计划、预算。

            procurement：采购、库存、出入库、物资业务。

            projects：投资、费用、数信、科技项目的业务操作。

            internal：内部交易、内部销售提交、内部采购确认、内部托收。

            oilgas：原油生产入库、油气销售、油气委托加工。原油生产入库必须选择本类，不能仅因“入库”二字归入物资采购；物资采购的出入库指采购物资和库存物料。

            equipment：设备管理、维修工单、检维修。

            master_ops：MDG、主数据的创建、查询、修改、冻结、分发、审核。

            master_rules：编码规则、字段定义、数据标准、属性规范。即使对象是物料或设备，问规则时也优先本类。

            projects_finance：项目结转、CJ88、项目成本与财务衔接。

            equipment_finance：维修工单结转、KO8G、维修费用与财务衔接。

            procurement_master：ERP 物料扩充或采购与物料主数据衔接。

            internal_funds：内部交易托收与资金衔接。

            finance_funds：付款与会计清账衔接。

            clarify：对象或动作的歧义会导致不同操作流程，或问题完全不属于资料范围。


            例如“项目已经结转了怎么撤销”选择 projects_finance；“维修工单结转后怎么取消”选择 equipment_finance；“结转怎么撤销”且历史无对象则选择
            clarify，追问是项目、维修工单还是其他结转。

            “新建物料”优先 master_ops；“物料不在工厂下，怎么批量扩充”选择 procurement_master；“物料编码规则”选择 master_rules。

            对于明确的报错或事务码，不要仅因为没有版本就强制追问。对于无法识别的新报错，可按业务对象选择相关库，资料不足由回答节点说明。

            询问创建维修工单且历史未说明工厂内修或外修时，选择 clarify，追问是内部维修还是外部维修；两者的工序控制码和合同要求不同。工单结转冲销不需要按此规则追问内外修。

            需要明确项目类型时在 query 中保留或补全用户已经提供的类型，不凭事务码自行猜测。

            不要选择所有库。跨域只选择上面预设的相关组合。


            输出 query、route、clarification 三个字段。query 必须是根据本轮真实提问整理的中文检索问题，不能是字段解释或示例。route=clarify
            时 clarification 写一句具体追问或说明支持的业务范围；其他情况下 clarification 为空字符串。

            另输出 search_query：用于检索的简短关键词串，以业务对象开头，接操作、报错码、角色和必要条件，词组用空格分隔。去掉“如何、请给出、完整操作步骤、相关配图”等请求格式，不丢失否定词、事务码、对象类型和错误码；不要扩展用户没有提到的业务动作。query
            保留自然语言的完整意图供回答使用。例如“维修工单 创建”，“付款单 创建 查询 付款申请岗”。

            clarification 直接面向业务用户，不介绍“分类器”“问题整理”等内部角色；需要介绍身份时称“ERP 运维知识助手”。

            '
        - id: route-user
          role: user
          text: 本轮真实问题：{{#sys.query#}}
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        structured_output_enabled: true
        structured_output:
          schema:
            type: object
            additionalProperties: false
            properties:
              query:
                type: string
              search_query:
                type: string
              route:
                type: string
                enum:
                - finance
                - funds
                - procurement
                - projects
                - internal
                - oilgas
                - equipment
                - master_ops
                - master_rules
                - projects_finance
                - equipment_finance
                - procurement_master
                - internal_funds
                - finance_funds
                - clarify
              clarification:
                type: string
            required:
            - query
            - search_query
            - route
            - clarification
        memory:
          window:
            enabled: true
            size: 6
          role_prefix:
            user: 用户
            assistant: 助手
          query_prompt_template: '请结合历史对话整理本轮真实问题，只输出结构化分类结果。

            本轮问题：{{#sys.query#}}'
