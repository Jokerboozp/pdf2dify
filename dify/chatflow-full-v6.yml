          text: '根据手册目录选择与用户明确业务对象一致的一份资料。优先匹配业务对象，其次匹配创建/修改等动作；不能因为其他对象的动作相同就选错对象。即使用户请求的动作未在目录体现，也选择同一业务对象的管理手册，由回答节点核实是否支持。问题同时询问创建和查询时，优先选择标题同时覆盖这些动作的资料。具体报错、异常问题可以选择常见问题资料；不能确定对应来源时留空，不按目录猜测故障答案。只有多份同样相关且无法确定、明确需要跨手册或目录无对应对象时
            source_id 为空字符串。必须照抄目录中的 source_id，不得编造；这里只选择资料，不回答操作。

            目录：

            2519c00a7aa329e5 | 财务模块常见问题.pdf

            53cd1b181830a57d | 1.付款单创建节点、付款单查询-付款申请岗.pdf

            c2d1ed1acf80c105 | 2.付款-个税、印花税、残疾保金-付款申请岗.pdf

            ac1450f6a5dc2371 | 3.财务报账单-增值税-付款申请岗.pdf

            93c92ee3ee2ae85f | 4.财务报账单-供应商预付款（无合同）-付款申请岗.pdf

            480ea7664c0adf77 | 5.财务报账单-无合同挂账付款-付款申请岗.pdf

            cdbc296ac48ffec9 | 6.财务报账单-客户款项退回（未清项）-付款申请岗.pdf

