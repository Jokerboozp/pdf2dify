kind: app
app:
  name: ERP运维知识助手-全量演示
  description: 9个业务主题，流程导航；本地 BM25 + 中文向量 + BGE 重排，原文图文溯源。
  mode: advanced-chat
  icon: 📚
  icon_type: emoji
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: 89052461-b125-4dd4-939a-a10c341f0821
    name: LOCAL_RETRIEVAL_TOKEN
    value_type: secret
    value: ''
    description: Local read-only retrieval authentication
  features:
    opening_statement: 你好，可以直接输入流程名称（如“财务月结”）查看整体概览，再选择需要展开的环节；也可以描述具体操作或报错。回答附原文页码，有相关原图时会展示。资料适用性待业务复核。
    suggested_questions:
    - 财务月结业务流程
    - 油气田单元创建流程
    - 项目结转后怎么撤销？
    suggested_questions_after_answer:
      enabled: false
    retriever_resource:
      enabled: true
    file_upload:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 500
      positionAbsolute:
        x: 0
        y: 500
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 用户提问
        desc: ''
        selected: false
        variables: []
    - id: normalize
      type: custom
      position:
        x: 300
        y: 500
      positionAbsolute:
        x: 300
        y: 500
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 理解问题并选择业务范围
        desc: ''
        selected: false
        model: &id001
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - id: route-system
          role: system
          text: '你是 ERP 运维问题整理与业务分类器。只整理问题和选择检索范围，不回答业务操作。

            结合最近对话补全指代；用户切换话题时以本轮明确对象为准。保留事务码、报错、否定条件、项目类型和用户指定版本，不编造缺失信息。


            route 只能选择以下值：

            finance：会计凭证、财务核算、发票、清账、财务月结。

            funds：资金、收付款、司库、资金计划、预算。

            procurement：采购、库存、出入库、物资业务。

            projects：投资、费用、数信、科技项目的业务操作。

            internal：内部交易、内部销售提交、内部采购确认、内部托收。

            oilgas：原油生产入库、油气销售、油气委托加工。原油生产入库必须选择本类，不能仅因“入库”二字归入物资采购；物资采购的出入库指采购物资和库存物料。

            equipment：设备管理、维修工单、检维修。

            master_ops：MDG、主数据的创建、查询、修改、冻结、分发、审核。

            master_rules：编码规则、字段定义、数据标准、属性规范。即使对象是物料或设备，问规则时也优先本类。

            projects_finance：项目结转、CJ88、项目成本与财务衔接。

            equipment_finance：维修工单结转、KO8G、维修费用与财务衔接。

            procurement_master：ERP 物料扩充或采购与物料主数据衔接。

            internal_funds：内部交易托收与资金衔接。

            finance_funds：付款与会计清账衔接。

            clarify：对象或动作的歧义会导致不同操作流程，或问题完全不属于资料范围。


            例如“项目已经结转了怎么撤销”选择 projects_finance；“维修工单结转后怎么取消”选择 equipment_finance；“结转怎么撤销”且历史无对象则选择
            clarify，追问是项目、维修工单还是其他结转。

            “新建物料”优先 master_ops；“物料不在工厂下，怎么批量扩充”选择 procurement_master；“物料编码规则”选择 master_rules。

            对于明确的报错或事务码，不要仅因为没有版本就强制追问。对于无法识别的新报错，可按业务对象选择相关库，资料不足由回答节点说明。

            询问创建维修工单且历史未说明工厂内修或外修时，选择 clarify，追问是内部维修还是外部维修；两者的工序控制码和合同要求不同。工单结转冲销不需要按此规则追问内外修。

            需要明确项目类型时在 query 中保留或补全用户已经提供的类型，不凭事务码自行猜测。

            不要选择所有库。跨域只选择上面预设的相关组合。


            输出 query、route、clarification 三个字段。query 必须是根据本轮真实提问整理的中文检索问题，不能是字段解释或示例。route=clarify
            时 clarification 写一句具体追问或说明支持的业务范围；其他情况下 clarification 为空字符串。

            另输出 search_query：用于检索的简短关键词串，以业务对象开头，接操作、报错码、角色和必要条件，词组用空格分隔。去掉“如何、请给出、完整操作步骤、相关配图”等请求格式，不丢失否定词、事务码、对象类型和错误码；不要扩展用户没有提到的业务动作。query
            保留自然语言的完整意图供回答使用。例如“维修工单 创建”，“付款单 创建 查询 付款申请岗”。

            事务码、错误码只能保留用户明确提供或当前指代已确认的历史内容，禁止凭模型常识补入。用户问“项目结转后怎么撤销”时不能自行添加 CJ88，问维修工单取消也不能自行添加
            KO8G。代码应由检索到的原文确定。撤销、取消结转、冲销是同一动作的不同问法，可保留原问法；不能把撤销改写成创建、执行结转。

            clarification 直接面向业务用户，不介绍“分类器”“问题整理”等内部角色；需要介绍身份时称“ERP 运维知识助手”。


            另输出 answer_mode，值为 overview 或 detail：

            - 用户只输入流程名称、手册主题、流程编号，或询问整个流程、流程概览、简要步骤/全部环节时，选 overview。这是有效的整体咨询，不因缺少具体动作而追问或拒绝。例：“财务月结”“财务月结业务流程”“油气田单元创建流程”“原油生产入库流程”。

            - 用户明确问某一步怎么执行、某个字段、某个错误码、某个异常的修复/撤销/提交等具体问题，选 detail。例：“项目结转后怎么撤销”“维修工单结转报错ZOPS999”“上市单位制造费用分摊怎么操作”。问“如何创建维修工单”仍按原规则先澄清内修/外修；问“维修工单创建流程有哪些环节”可以
            overview。

            - 概览后用户回答“第二个”“展开项目结转”“只看上市单位”等，结合历史概览中的具体选项补全本轮对象与动作，再选 detail，不继续重复概览。query
            和 search_query 用实际环节名称替换“第N个/部分”等对话序号；这不是原文章节编号。保留用户已选择的环节和来源主题，不把手册中的其他分支带入。

            - overview 时 query 保留用户的流程名称和整体意图，search_query 保留名称；不自行添加用户没有要求的详细业务动作。


            以下是当前主数据操作手册的真实主题。问题涉及这些主数据对象的维护/创建/审批等操作时，优先 master_ops，不能仅因“油气田、设备、会计科目、项目”等词误选其他业务库；数据标准/编码规则仍按
            master_rules，概览仍走 overview。

